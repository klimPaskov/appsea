<rect x="24" y="20.0" width="26" height="26" rx="8" fill="#171a1f"/>
<text x="37.0" y="37.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">A</text>
<text x="60" y="38.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171a1f" text-anchor="start" letter-spacing="0">AppSea</text>
<text x="366" y="38.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#73767c" text-anchor="end" letter-spacing="0">Leaderboard</text>
<text x="24" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">Leaderboard  /  Inbox Relay</text><text x="24" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#73767c" text-anchor="start" letter-spacing="1.2">OPPORTUNITY 80.3</text><text x="24" y="208" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-2.4">Inbox Relay</text><text x="24" y="245" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">A reliable handoff layer for shared team</text><text x="24" y="269" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">inboxes.</text><text x="24" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Overview</text><text x="110" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Complaints</text><text x="196" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#171a1f" text-anchor="start" letter-spacing="0">Competitors</text><line x1="196" y1="334" x2="273" y2="334" stroke="#171a1f" stroke-width="2" /><text x="282" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Coding plan</text><line x1="24" y1="335" x2="366" y2="335" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="383" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.8">Competitors and alternatives</text><line x1="24" y1="411" x2="366" y2="411" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="448" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.3">Shared inbox suites</text><text x="366" y="448" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#73767c" text-anchor="end" letter-spacing="0">direct</text><text x="24" y="481" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Broad routing, but complex setup and weak</text><text x="24" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">handoff reasoning.</text><text x="24" y="516" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#73767c" text-anchor="start" letter-spacing="0.8">FEATURE COVERAGE</text><text x="24" y="537" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">Handoff history partial / cross-shift summary</text><text x="24" y="554" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">missing.</text><line x1="24" y1="551" x2="366" y2="551" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="588" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.3">Email labels and rules</text><text x="366" y="588" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#73767c" text-anchor="end" letter-spacing="0">platform</text><text x="24" y="621" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Already available, but no durable ownership</text><text x="24" y="642" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">history.</text><text x="24" y="656" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#73767c" text-anchor="start" letter-spacing="0.8">FEATURE COVERAGE</text><text x="24" y="677" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">Routing rules supported / handoff history</text><text x="24" y="694" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">missing.</text><line x1="24" y1="691" x2="366" y2="691" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="728" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.3">Shift handoff document</text><text x="366" y="728" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#73767c" text-anchor="end" letter-spacing="0">workaround</text><text x="24" y="761" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Flexible, but stale and dependent on manual</text><text x="24" y="782" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">discipline.</text><text x="24" y="796" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#73767c" text-anchor="start" letter-spacing="0.8">FEATURE COVERAGE</text><text x="24" y="817" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">Handoff summary supported / live state sync</text><text x="24" y="834" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">missing.</text><line x1="24" y1="831" x2="366" y2="831" stroke="#d9d8d2" stroke-width="1" /><rect x="24" y="867" width="342" height="104" rx="0" fill="#fcfbf8" stroke="#d9d8d2" stroke-width="1"/><text x="46" y="896" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#73767c" text-anchor="start" letter-spacing="1.1">CONTRARY EVIDENCE</text><text x="46" y="926" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Existing shared inbox suites may solve the</text><text x="46" y="947" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">problem through better configuration.</text>
</svg>