<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<rect width="390" height="844" fill="#f7f6f2" />
<line x1="0" y1="66" x2="390" y2="66" stroke="#e8e6df" stroke-width="1" />
<rect x="24" y="20.0" width="26" height="26" rx="8" fill="#171a1f"/>
<text x="37.0" y="37.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">A</text>
<text x="60" y="38.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171a1f" text-anchor="start" letter-spacing="0">AppSea</text>
<text x="366" y="38.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#73767c" text-anchor="end" letter-spacing="0">Leaderboard</text>
<text x="24" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">Leaderboard  /  Inbox Relay</text><text x="24" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#73767c" text-anchor="start" letter-spacing="1.2">OPPORTUNITY 80.3</text><text x="24" y="208" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-2.4">Inbox Relay</text><text x="24" y="245" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">A reliable handoff layer for shared team</text><text x="24" y="269" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">inboxes.</text><text x="24" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Overview</text><text x="110" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Complaints</text><text x="196" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#171a1f" text-anchor="start" letter-spacing="0">Competitors</text><line x1="196" y1="334" x2="273" y2="334" stroke="#171a1f" stroke-width="2" /><text x="282" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Coding plan</text><line x1="24" y1="335" x2="366" y2="335" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="383" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.8">Competitors and alternatives</text><line x1="24" y1="411" x2="366" y2="411" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="448" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.3">Shared inbox suites</text><text x="366" y="448" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#73767c" text-anchor="end" letter-spacing="0">direct</text><text x="24" y="481" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Broad routing, but complex setup and weak</text><text x="24" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">handoff reasoning.</text><line x1="24" y1="523" x2="366" y2="523" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="560" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.3">Email labels and rules</text><text x="366" y="560" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#73767c" text-anchor="end" letter-spacing="0">platform</text><text x="24" y="593" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Already available, but no durable ownership</text><text x="24" y="614" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">history.</text><line x1="24" y1="635" x2="366" y2="635" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="672" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.3">Shift handoff document</text><text x="366" y="672" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#73767c" text-anchor="end" letter-spacing="0">workaround</text><text x="24" y="705" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Flexible, but stale and dependent on manual</text><text x="24" y="726" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">discipline.</text><line x1="24" y1="747" x2="366" y2="747" stroke="#d9d8d2" stroke-width="1" /><rect x="24" y="783" width="342" height="104" rx="0" fill="#fcfbf8" stroke="#d9d8d2" stroke-width="1"/><text x="46" y="812" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#73767c" text-anchor="start" letter-spacing="1.1">CONTRARY EVIDENCE</text><text x="46" y="842" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Existing shared inbox suites may solve the</text><text x="46" y="863" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">problem through better configuration.</text>
</svg>