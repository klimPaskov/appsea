<text x="220" y="132" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.1">Private research workspace</text><text x="220" y="186" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="650" fill="#f5f7ff" text-anchor="start" letter-spacing="-2.5">Billing workflow history</text><text x="220" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Browse durable collection runs without exposing source payloads or</text><text x="220" y="257" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">workflow hashes.</text><text x="220" y="308" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.1">SINGLE-SOURCE RUNS</text><line x1="220" y1="328" x2="1220" y2="328" stroke="#f5f7ff" stroke-width="1" /><text x="220" y="356" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#f5f7ff" text-anchor="start" letter-spacing="0">completed  ·  10 items</text><text x="220" y="380" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">run:billing</text><text x="1220" y="358" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ba8c3" text-anchor="end" letter-spacing="0">2026-08-02 00:01</text><line x1="220" y1="414" x2="1220" y2="414" stroke="#2a3854" stroke-width="1" /><text x="220" y="442" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#f5f7ff" text-anchor="start" letter-spacing="0">running  ·  4 items</text><text x="220" y="466" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">run:billing:next</text><text x="122