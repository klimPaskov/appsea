<line x1="0" y1="66" x2="390" y2="66" stroke="#18243a" stroke-width="1" />
<rect x="24" y="20.0" width="26" height="26" rx="8" fill="#9b5cff"/>
<text x="37.0" y="37.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">A</text>
<text x="60" y="38.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5f7ff" text-anchor="start" letter-spacing="0">AppSea</text>
<text x="366" y="38.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="end" letter-spacing="0">Leaderboard</text>
<text x="24" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Leaderboard  /  Inbox Relay</text><text x="24" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.2">OPPORTUNITY 80.3</text><text x="24" y="208" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="650" fill="#f5f7ff" text-anchor="start" letter-spacing="-2.4">Inbox Relay</text><text x="24" y="245" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">A reliable handoff layer for shared team</text><text x="24" y="269" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">inboxes.</text><text x="24" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#f5f7ff" text-anchor="start" letter-spacing="0">Overview</text><line x1="24" y1="334" x2="82" y2="334" stroke="#f5f7ff" stroke-width="2" /><text x="110" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Complaints</text><text x="196" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Competitors</text><text x="282" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Coding plan</text><line x1="24" y1="335" x2="366" y2="335" stroke="#2a3854" stroke-width="1" /><text x="24" y="383" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.2">THESIS</text><text x="24" y="421" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">Small support teams need a</text><text x="24" y="455" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">clear ownership trail and</text><text x="24" y="489" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">shift handoff without</text><text x="24" y="523" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">adopting a large service</text><text x="24" y="557" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">platform.</text><line x1="24" y1="557" x2="366" y2="557" stroke="#2a3854" stroke-width="1" /><text x="24" y="591" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.1">AUDIENCE</text><text x="24" y="619" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">Small support and operations teams using</text><text x="24" y="641" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">shared email.</text><text x="24" y="689" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.1">FIRST WEDGE</text><text x="24" y="717" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">Read-only inbox sync, ownership history,</text><text x="24" y="739" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">unresolved handoffs, and a shift summary.</text>
</svg>