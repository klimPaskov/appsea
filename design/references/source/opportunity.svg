<text x="1364" y="43.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="end" letter-spacing="0">Leaderboard</text>
<text x="220" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Leaderboard  /  Inbox Relay</text><text x="220" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.2">OPPORTUNITY 80.3</text><text x="220" y="234" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="650" fill="#f5f7ff" text-anchor="start" letter-spacing="-3.2">Inbox Relay</text><text x="220" y="276" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">A reliable handoff layer for shared team inboxes.</text><text x="220" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#f5f7ff" text-anchor="start" letter-spacing="0">Overview</text><line x1="220" y1="371" x2="278" y2="371" stroke="#f5f7ff" stroke-width="2" /><text x="336" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Complaints</text><text x="452" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Competitors</text><text x="568" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Coding plan</text><line x1="220" y1="372" x2="1220" y2="372" stroke="#2a3854" stroke-width="1" /><text x="220" y="438" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.2">THESIS</text><text x="220" y="476" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">Small support teams need a clear ownership trail and</text><text x="220" y="524" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">shift handoff without adopting a large service platform.</text><line x1="220" y1="622" x2="1220" y2="622" stroke="#2a3854" stroke-width="1" /><text x="220" y="660" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.1">AUDIENCE</text><text x="220" y="692" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">Small support, customer success, and operations</text><text x="220" y="716" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">teams using shared email.</text><text x="752.0" y="660" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.1">FIRST WEDGE</text><text x="752.0" y="692" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">Read-only inbox sync with ownership history,</text><text x="752.0" y="716" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">unresolved handoff queue, and shift summary.</text>
</svg>