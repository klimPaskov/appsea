lvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">run:billing:next</text><text x="366" y="448" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="end" letter-spacing="0">2026-08-03 09:14</text><line x1="24" y1="520" x2="366" y2="520" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="562" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#73767c" text-anchor="start" letter-spacing="1.1">MULTI-SOURCE RUNS</text><line x1="24" y1="582" x2="366" y2="582" stroke="#171a1f" stroke-width="1" /><text x="24" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Parent and child states use the same</text><text x="24" y="641" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">private cursor boundary. Older pages remain</text><text x="24" y="662" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">available without changing the public</text><text x="24" y="683" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">leaderboard.</text>
