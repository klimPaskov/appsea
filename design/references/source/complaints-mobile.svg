<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<rect width="390" height="844" fill="#f7f6f2" />
<line x1="0" y1="66" x2="390" y2="66" stroke="#e8e6df" stroke-width="1" />
<rect x="24" y="20.0" width="26" height="26" rx="8" fill="#171a1f"/>
<text x="37.0" y="37.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">A</text>
<text x="60" y="38.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171a1f" text-anchor="start" letter-spacing="0">AppSea</text>
<text x="366" y="38.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#73767c" text-anchor="end" letter-spacing="0">Leaderboard</text>
<text x="24" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">Leaderboard  /  Inbox Relay</text><text x="24" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#73767c" text-anchor="start" letter-spacing="1.2">OPPORTUNITY 80.3</text><text x="24" y="208" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-2.4">Inbox Relay</text><text x="24" y="245" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">A reliable handoff layer for shared team</text><text x="24" y="269" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">inboxes.</text><text x="24" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Overview</text><text x="110" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#171a1f" text-anchor="start" letter-spacing="0">Complaints</text><line x1="110" y1="334" x2="180" y2="334" stroke="#171a1f" stroke-width="2" /><text x="196" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Competitors</text><text x="282" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Coding plan</text><line x1="24" y1="335" x2="366" y2="335" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="383" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.8">Curated complaints</text><line x1="24" y1="411" x2="366" y2="411" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="440" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">TeamMail · handoff loss</text><text x="24" y="470" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#171a1f" text-anchor="start" letter-spacing="0">Assigned messages disappear from the team</text><text x="24" y="492" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#171a1f" text-anchor="start" letter-spacing="0">view after ownership changes.</text><line x1="24" y1="516" x2="366" y2="516" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="545" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">TeamMail · handoff loss</text><text x="24" y="575" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#171a1f" text-anchor="start" letter-spacing="0">A teammate cannot see why a conversation</text><text x="24" y="597" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#171a1f" text-anchor="start" letter-spacing="0">was reassigned or what happened before.</text><line x1="24" y1="621" x2="366" y2="621" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="650" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">SupportBox · state drift</text><text x="24" y="680" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#171a1f" text-anchor="start" letter-spacing="0">Solved threads return as unread and create</text><text x="24" y="702" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#171a1f" text-anchor="start" letter-spacing="0">duplicate work for the next shift.</text><line x1="24" y1="726" x2="366" y2="726" stroke="#d9d8d2" stroke-width="1" /><text x="24" y="755" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">SupportBox · accountability gap</text><text x="24" y="785" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#171a1f" text-anchor="start" letter-spacing="0">The team cannot tell who changed an owner,</text><text x="24" y="807" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#171a1f" text-anchor="start" letter-spacing="0">status, or priority during a busy handoff.</text><line x1="24" y1="831" x2="366" y2="831" stroke="#d9d8d2" stroke-width="1" />
</svg>