<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<rect width="1440" height="1000" fill="#f7f6f2" />
<line x1="0" y1="76" x2="1440" y2="76" stroke="#e8e6df" stroke-width="1" />
<rect x="76" y="24" width="28" height="28" rx="8" fill="#171a1f" />
<text x="90" y="42.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<text x="114" y="43.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171a1f">AppSea</text>
<text x="1364" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#73767c" text-anchor="end">Leaderboard</text>
<text x="290" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#73767c">Workspace / Agent access</text>
<text x="290" y="220" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#73767c" letter-spacing="1.1">PRIVATE WORKSPACE</text>
<text x="290" y="276" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="650" fill="#171a1f" letter-spacing="-2.6">Agent access</text>
<text x="290" y="322" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#73767c">Connect a coding agent to approved AppSea reads without giving it write access</text>
<text x="290" y="348" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#73767c">to this private workspace.</text>
<text x="290" y="408" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#73767c" letter-spacing="1.1">READ-ONLY BOUNDARY</text>
<line x1="290" y1="428" x2="1150" y2="428" stroke="#171a1f" stroke-width="1" />
<text x="290" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#41444a">MCP reads are workspace-bound, scope-filtered, and approval-gated.</text>
<text x="290" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#73767c">Imported content stays untrusted; coverage gaps remain visible.</text>
<text x="290" y="548" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#73767c" letter-spacing="1.1">CREATE A READ-ONLY TOKEN</text>
<line x1="290" y1="568" x2="1150" y2="568" stroke="#171a1f" stroke-width="1" />
<text x="290" y="600" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#73767c">TOKEN LABEL</text>
<rect x="290" y="612" width="410" height="42" rx="5" fill="#fcfbf8" stroke="#d9d8d2" />
<text x="304" y="638" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#73767c">Build agent</text>
<text x="726" y="600" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#73767c">EXPIRES IN</text>
<rect x="726" y="612" width="190" height="42" rx="5" fill="#fcfbf8" stroke="#d9d8d2" />
<text x="740" y="638" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#41444a">30 days</text>
<text x="290" y="696" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#73767c">READ SCOPES</text>
<rect x="290" y="712" width="252" height="56" rx="5" fill="#fcfbf8" stroke="#d9d8d2" />
<rect x="308" y="731" width="18" height="18" fill="#fcfbf8" stroke="#315ee8" />
<text x="340" y="745" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#41444a">Opportunities</text>
<rect x="558" y="712" width="252" height="56" rx="5" fill="#fcfbf8" stroke="#d9d8d2" />
<rect x="576" y="731" width="18" height="18" fill="#fcfbf8" stroke="#315ee8" />
<text x="608" y="745" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#41444a">Evidence</text>
<rect x="826" y="712" width="252" height="56" rx="5" fill="#fcfbf8" stroke="#d9d8d2" />
<rect x="844" y="731" width="18" height="18" fill="#fcfbf8" stroke="#315ee8" />
<text x="876" y="745" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#41444a">Reports and plans</text>
<rect x="290" y="806" width="128" height="36" rx="5" fill="#171a1f" />
<text x="354" y="829" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="650" fill="#ffffff" text-anchor="middle">Create token</text>
<text x="290" y="876" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#73767c">Creation and revocation require recent password reauthentication and MFA when enabled.</text>
</svg>
