<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<rect width="1440" height="1000" fill="#050711" />
<line x1="0" y1="76" x2="1440" y2="76" stroke="#18243a" stroke-width="1" />
<rect x="76" y="24.0" width="28" height="28" rx="8" fill="#9b5cff"/>
<text x="90.0" y="42.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">A</text>
<text x="114" y="43.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5f7ff" text-anchor="start" letter-spacing="0">AppSea</text>
<text x="1364" y="43.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="end" letter-spacing="0">Leaderboard</text>
<text x="220" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Leaderboard  /  Inbox Relay</text><text x="220" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.2">OPPORTUNITY 80.3</text><text x="220" y="234" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="650" fill="#f5f7ff" text-anchor="start" letter-spacing="-3.2">Inbox Relay</text><text x="220" y="276" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">A reliable handoff layer for shared team inboxes.</text><text x="220" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Overview</text><text x="336" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Complaints</text><text x="452" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#f5f7ff" text-anchor="start" letter-spacing="0">Competitors</text><line x1="452" y1="371" x2="529" y2="371" stroke="#f5f7ff" stroke-width="2" /><text x="568" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Coding plan</text><line x1="220" y1="372" x2="1220" y2="372" stroke="#2a3854" stroke-width="1" /><text x="220" y="432" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="650" fill="#f5f7ff" text-anchor="start" letter-spacing="-0.8">Competitors and alternatives</text><line x1="220" y1="460" x2="1220" y2="460" stroke="#2a3854" stroke-width="1" /><text x="220" y="497" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#f5f7ff" text-anchor="start" letter-spacing="-0.3">Shared inbox suites</text><text x="1220" y="497" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ba8c3" text-anchor="end" letter-spacing="0">direct</text><text x="220" y="530" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">Broad routing, but complex setup and weak handoff reasoning.</text><text x="220" y="565" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="0.8">FEATURE COVERAGE</text><text x="220" y="586" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Handoff history partial / cross-shift summary missing.</text><line x1="220" y1="610" x2="1220" y2="610" stroke="#2a3854" stroke-width="1" /><text x="220" y="647" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#f5f7ff" text-anchor="start" letter-spacing="-0.3">Email labels and rules</text><text x="1220" y="647" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ba8c3" text-anchor="end" letter-spacing="0">platform</text><text x="220" y="680" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">Already available, but no durable ownership history.</text><text x="220" y="715" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="0.8">FEATURE COVERAGE</text><text x="220" y="736" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Routing rules supported / handoff history missing.</text><line x1="220" y1="760" x2="1220" y2="760" stroke="#2a3854" stroke-width="1" /><text x="220" y="797" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#f5f7ff" text-anchor="start" letter-spacing="-0.3">Shift handoff document</text><text x="1220" y="797" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ba8c3" text-anchor="end" letter-spacing="0">workaround</text><text x="220" y="830" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">Flexible, but stale and dependent on manual discipline.</text><text x="220" y="865" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="0.8">FEATURE COVERAGE</text><text x="220" y="886" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Handoff summary supported / live state sync missing.</text><line x1="220" y1="910" x2="1220" y2="910" stroke="#2a3854" stroke-width="1" /><rect x="220" y="946" width="1000" height="112" rx="0" fill="#0b1220" stroke="#2a3854" stroke-width="1"/><text x="242" y="975" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.1">CONTRARY EVIDENCE</text><text x="242" y="1005" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#c4cde0" text-anchor="start" letter-spacing="0">Existing shared inbox suites may solve the problem through better configuration.</text>
</svg>