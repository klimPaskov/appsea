<text x="90.0" y="42.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">A</text>
<text x="114" y="43.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171a1f" text-anchor="start" letter-spacing="0">AppSea</text>
<text x="1364" y="43.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#73767c" text-anchor="end" letter-spacing="0">Leaderboard</text>
<text x="220" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">Leaderboard  /  Inbox Relay</text><text x="220" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#73767c" text-anchor="start" letter-spacing="1.2">OPPORTUNITY 80.3</text><text x="220" y="234" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-3.2">Inbox Relay</text><text x="220" y="276" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#73767c" text-anchor="start" letter-spacing="0">A reliable handoff layer for shared team inboxes.</text><text x="220" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Overview</text><text x="336" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Complaints</text><text x="452" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#171a1f" text-anchor="start" letter-spacing="0">Competitors</text><line x1="452" y1="371" x2="529" y2="371" stroke="#171a1f" stroke-width="2" /><text x="568" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#73767c" text-anchor="start" letter-spacing="0">Coding plan</text><line x1="220" y1="372" x2="1220" y2="372" stroke="#d9d8d2" stroke-width="1" /><text x="220" y="432" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.8">Competitors and alternatives</text><line x1="220" y1="460" x2="1220" y2="460" stroke="#d9d8d2" stroke-width="1" /><text x="220" y="497" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.3">Shared inbox suites</text><text x="1220" y="497" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="end" letter-spacing="0">direct</text><text x="220" y="530" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Broad routing, but complex setup and weak handoff reasoning.</text><line x1="220" y1="586" x2="1220" y2="586" stroke="#d9d8d2" stroke-width="1" /><text x="220" y="623" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.3">Email labels and rules</text><text x="1220" y="623" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="end" letter-spacing="0">platform</text><text x="220" y="656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Already available, but no durable ownership history.</text><line x1="220" y1="712" x2="1220" y2="712" stroke="#d9d8d2" stroke-width="1" /><text x="220" y="749" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#171a1f" text-anchor="start" letter-spacing="-0.3">Shift handoff document</text><text x="1220" y="749" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#73767c" text-anchor="end" letter-spacing="0">workaround</text><text x="220" y="782" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Flexible, but stale and dependent on manual discipline.</text><line x1="220" y1="838" x2="1220" y2="838" stroke="#d9d8d2" stroke-width="1" /><rect x="220" y="874" width="1000" height="112" rx="0" fill="#fcfbf8" stroke="#d9d8d2" stroke-width="1"/><text x="242" y="903" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#73767c" text-anchor="start" letter-spacing="1.1">CONTRARY EVIDENCE</text><text x="242" y="933" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#41444a" text-anchor="start" letter-spacing="0">Existing shared inbox suites may solve the problem through better configuration.</text>
</svg>