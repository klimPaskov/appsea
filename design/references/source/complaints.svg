<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<rect width="1440" height="1000" fill="#050711" />
<line x1="0" y1="76" x2="1440" y2="76" stroke="#18243a" stroke-width="1" />
<rect x="76" y="24.0" width="28" height="28" rx="8" fill="#9b5cff"/>
<text x="90.0" y="42.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">A</text>
<text x="114" y="43.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5f7ff" text-anchor="start" letter-spacing="0">AppSea</text>
<text x="1364" y="43.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="end" letter-spacing="0">Leaderboard</text>
<text x="220" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Leaderboard  /  Inbox Relay</text><text x="220" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#9ba8c3" text-anchor="start" letter-spacing="1.2">OPPORTUNITY 80.3</text><text x="220" y="234" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="650" fill="#f5f7ff" text-anchor="start" letter-spacing="-3.2">Inbox Relay</text><text x="220" y="276" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">A reliable handoff layer for shared team inboxes.</text><text x="220" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Overview</text><text x="336" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#f5f7ff" text-anchor="start" letter-spacing="0">Complaints</text><line x1="336" y1="371" x2="406" y2="371" stroke="#f5f7ff" stroke-width="2" /><text x="452" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Competitors</text><text x="568" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9ba8c3" text-anchor="start" letter-spacing="0">Coding plan</text><line x1="220" y1="372" x2="1220" y2="372" stroke="#2a3854" stroke-width="1" /><text x="220" y="432" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="650" fill="#f5f7ff" text-anchor="start" letter-spacing="-0.8">Curated complaints</text><text x="1220" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#9ba8c3" text-anchor="end" letter-spacing="0">Representative synthetic observations.</text><line x1="220" y1="460" x2="1220" y2="460" stroke="#2a3854" stroke-width="1" /><text x="220" y="489" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">TeamMail · handoff loss</text><text x="220" y="519" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">Assigned messages disappear from the team view after ownership changes.</text><line x1="220" y1="576" x2="1220" y2="576" stroke="#2a3854" stroke-width="1" /><text x="220" y="605" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">TeamMail · handoff loss</text><text x="220" y="635" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">A teammate cannot see why a conversation was reassigned or what happened</text><text x="220" y="662" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">before.</text><line x1="220" y1="692" x2="1220" y2="692" stroke="#2a3854" stroke-width="1" /><text x="220" y="721" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">SupportBox · state drift</text><text x="220" y="751" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">Solved threads return as unread and create duplicate work for the next shift.</text><line x1="220" y1="808" x2="1220" y2="808" stroke="#2a3854" stroke-width="1" /><text x="220" y="837" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ba8c3" text-anchor="start" letter-spacing="0">SupportBox · accountability gap</text><text x="220" y="867" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">The team cannot tell who changed an owner, status, or priority during a busy</text><text x="220" y="894" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#f5f7ff" text-anchor="start" letter-spacing="0">handoff.</text><line x1="220" y1="924" x2="1220" y2="924" stroke="#2a3854" stroke-width="1" />
</svg>