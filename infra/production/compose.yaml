name: appsea-production

services:
  preflight:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    env_file:
      - path: ./production.env
        required: false
    environment:
      NODE_ENV: production
    entrypoint: ['pnpm']
    command: ['production:preflight']
    restart: 'no'

  migrate:
    profiles: ['migrate']
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    env_file:
      - path: ./production.env
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      preflight:
        condition: service_completed_successfully
    entrypoint: ['pnpm']
    command: ['db:migrate']
    restart: 'no'

  web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
    env_file:
      - path: ./production.env
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      preflight:
        condition: service_completed_successfully
    ports:
      - '${APPSEA_WEB_BIND_ADDRESS:-127.0.0.1}:${APPSEA_WEB_PORT:-3000}:3000'
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    env_file:
      - path: ./production.env
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      preflight:
        condition: service_completed_successfully
    stop_grace_period: '${APPSEA_WORKER_DRAIN_TIMEOUT_SECONDS:-120}s'
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  maintenance:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    env_file:
      - path: ./production.env
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      preflight:
        condition: service_completed_successfully
    command: ['maintenance:loop']
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  alerts:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    env_file:
      - path: ./production.env
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      preflight:
        condition: service_completed_successfully
    command: ['alerts:loop']
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
