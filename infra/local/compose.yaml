name: appsea-local

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-bootstrap-only
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - appsea-postgres-data:/var/lib/postgresql
      - ./init/0001-create-test-database.sql:/docker-entrypoint-initdb.d/0001-create-test-database.sql:ro

  temporal:
    image: temporalio/temporal:1.8.0
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
      - --ui-disable-news-fetch
    ports:
      - '127.0.0.1:7233:7233'
      - '127.0.0.1:8233:8233'
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - appsea-temporal-data:/home/temporal

volumes:
  appsea-postgres-data:
  appsea-temporal-data:
